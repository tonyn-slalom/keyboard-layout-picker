<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Keyboard Layout Picker</title>
    <script>
      // GitHub Pages SPA fallback redirect
      // Keep this in sync with repo path depth: /<user>/<repo>/...
      var segmentCount = 1;
      var locationData = window.location;
      var redirectUrl =
        locationData.protocol +
        '//' +
        locationData.hostname +
        (locationData.port ? ':' + locationData.port : '') +
        locationData.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
        '/?/' +
        locationData.pathname
          .slice(1)
          .split('/')
          .slice(segmentCount)
          .join('/')
          .replace(/&/g, '~and~') +
        (locationData.search
          ? '&' + locationData.search.slice(1).replace(/&/g, '~and~')
          : '') +
        locationData.hash;

      location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
